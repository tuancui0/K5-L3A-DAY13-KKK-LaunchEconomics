# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm cho mức chênh 5 điểm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48;
#      cần 3.103 yêu cầu và 42 nhân viên mỗi nhóm, vượt tổng 40 nhân viên.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000,
#      nhỏ hơn 1.251 yêu cầu mỗi nhóm cho mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300.
#   e) Mức chênh 6 điểm: cần 859 yêu cầu hiệu dụng mỗi nhóm;
#      20 nhân viên mỗi nhóm, ít nhất 299 yêu cầu/người, DE = 6,96;
#      cỡ mẫu hiệu dụng = 20 × 299 / 6,96 ≈ 859 mỗi nhóm.
#
# D2 · Cả nhóm kiểm tra khả năng tách tác động của cách chia đã chọn:
#   1. Có: 20 nhân viên đối chứng làm cùng thời gian, trong cùng các depot.
#   2. Chia ngẫu nhiên theo nhân viên bằng seed 20261121, phân tầng theo depot.
#   3. Có thể chia sẻ câu trả lời trong depot; khóa quyền theo staff_id và ghi log mở trợ lý.
#   4. Chỉ số, ngưỡng, luật dừng và ngày quyết định được ghi trước 2026-11-23.
#   5. Có đúng 20 cụm nhân viên mỗi nhóm.
#
# Cả nhóm chọn chia ngẫu nhiên theo nhân viên: 20 người dùng trợ lý, 20 đối chứng.
# Đánh đổi đã chấp nhận: với 40 nhân viên và ICC 0,02, không đủ power 0,80
# để phát hiện mức tăng 5 điểm; pilot nhắm mức tăng 6 điểm với m >= 299.
# Nếu tác động thật chỉ là 5 điểm, power giảm còn khoảng 0,64.
# Giữ bước 0,50 thêm một tuần: khoảng 1.500 × (982/1.200) / 40 × 14 ≈ 430
# yêu cầu đủ phạm vi mỗi nhân viên trong 14 ngày, trên mức tối thiểu 299;
# chỉ chốt khi số yêu cầu thực của từng nhân viên đạt ngưỡng.
#
# mo_lai_trong_7_ngay hiện tại: 4,25% toàn mẫu; 3,97% trong phạm vi pilot.
# Ngưỡng an toàn: > 6% tuyệt đối hoặc cao hơn đối chứng >= 2 điểm phần trăm,
# chỉ đánh giá trên những yêu cầu đã đủ 7 ngày theo dõi.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "12 depot; chỉ noi_dia và hang_nang (0,22× và 0,69× chi phí nhân viên tự làm, simulated); loại quoc_te (1,88×, simulated) và doi_tac (0,85×, simulated; điều khoản riêng)"
  assignment:
    unit: staff                   # 20 cụm nhân viên mỗi nhóm
    control_share: 0.5
    randomized: true
    stratified_by: depot
    seed: 20261121
    min_requests_per_staff: 299
  start_date: "2026-11-23"
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên, mỗi bước một tuần
  primary_analysis_window: "Giữ mức 0,50 thêm 1 tuần; đo chỉ số chính trong 14 ngày ở mức 0,50, sau khi từng nhân viên có ít nhất 299 yêu cầu đủ phạm vi"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi: không đủ mẫu cho mục tiêu 0,05
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # yêu cầu hiệu dụng mỗi nhóm
    design_effect: 6.96           # m = 299 yêu cầu mỗi nhân viên
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng cùng thời gian và cùng depot; chỉ đo chỉ số chính từ bước rollout 0,50"
    spillover_risk: "Có thể chia sẻ câu trả lời trong depot; giới hạn truy cập theo staff_id, ghi event mở trợ lý và kiểm tra dùng sai nhóm mỗi tuần"
    predeclared: "Chốt chỉ số chính, MDE 0,06, luật dừng và ngày quyết định trước 2026-11-23"
  stop_rules:
    - "NẾU có ít nhất 1 ca hoàn trùng TRONG bất kỳ ngày nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển mọi yêu cầu sang nhân viên KHÔNG THÌ không được mở rộng trước khi hoàn tất đối soát sổ cái mỗi ngày"
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý vượt 6% hoặc cao hơn đối chứng ít nhất 2 điểm phần trăm TRONG 2 đợt đủ 7 ngày theo dõi liên tiếp THÌ Giám đốc vận hành dừng rollout và điều tra lỗi KHÔNG THÌ không được mở rộng khi chưa có đủ dữ liệu theo dõi 7 ngày"
    - "NẾU chi phí biến đổi mỗi việc thành công đo từ thời gian nhân viên thật vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở bước rollout kế tiếp khi thiếu báo cáo chi phí tuần"
    - "NẾU dưới 70% nhân viên nhóm trợ lý mở trợ lý ít nhất 1 lần TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và sửa luồng dùng KHÔNG THÌ không được mở bước rollout kế tiếp khi thiếu event sử dụng"
  interim_looks: "Theo dõi an toàn liên tục; kiểm tra chi phí và mức độ sử dụng theo tuần cho luật dừng; không kiểm định chỉ số chính trước ngày quyết định"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; nhân viên CSKH xử lý yêu cầu theo quy trình thủ công"
  decision_date: "2026-12-28"    # sau 7 ngày theo dõi cuối; thiếu 299 yêu cầu/người thì chưa kết luận Go
  simulated_inputs: [phut_xem_lai_simulated, phut_lam_lai_simulated]
